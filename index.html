<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>produced by Eugen Kisler</title>
<meta name="theme-color" content="#fdfcf7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Вопросы">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' fill='%23fdfcf7'/%3E%3Cg transform='translate(46,40) scale(1.05)' fill='none' stroke='%23d32f2f' stroke-width='3' stroke-linecap='round'%3E%3Cpath d='M 37 57 L 15 20'/%3E%3Cellipse cx='50' cy='65' rx='16' ry='17'/%3E%3Cpath d='M 43 82 L 42 96'/%3E%3Cpath d='M 48 82 L 50 96'/%3E%3Cpath d='M 57 82 L 57 98'/%3E%3Cpath d='M 62 80 L 65 96'/%3E%3Cellipse cx='58' cy='38' rx='10' ry='9'/%3E%3Cpath d='M 49 33 L 48 24 L 56 30'/%3E%3Cpath d='M 60 30 L 68 26 L 66 35'/%3E%3C/g%3E%3C/svg%3E">
<style>
@import url('https://fonts.googleapis.com/css2?family=Bad+Script&display=swap');
:root{color-scheme:light only}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#fff!important;color:#1e295d!important;font-family:'Bad Script',cursive,sans-serif}
body{display:flex;justify-content:center;align-items:center}
.app{width:100%;max-width:420px;height:100%;max-height:900px;position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:10px 0}
.slider{width:90%;aspect-ratio:3/4;max-height:78vh;position:relative;perspective:1000px;margin-bottom:14px}
.card{position:absolute;width:100%;height:100%;background-color:#fdfcf7;background-image:linear-gradient(rgba(80,120,190,.6) 1px,transparent 1px),linear-gradient(90deg,rgba(80,120,190,.6) 1px,transparent 1px);background-size:14px 14px;border-radius:4px;box-shadow:0 10px 30px rgba(0,0,0,.35);padding:10px;transition:transform .4s,opacity .4s;touch-action:pan-y;border:1px solid #c8c8c8;overflow:hidden}
.flag{position:absolute;bottom:50px;left:34px;z-index:10;display:flex;flex-direction:row;gap:5px}
.fb{background:rgba(255,255,255,.9);border:1px solid rgba(30,41,93,.2);border-radius:5px;width:32px;height:24px;font-size:15px;cursor:pointer;display:flex;justify-content:center;align-items:center;opacity:.4;transition:all .2s;padding:0;line-height:1;position:relative}
.fb.on{opacity:1;border-color:#1e295d;box-shadow:0 2px 6px rgba(30,41,93,.25)}
.fb .ck{display:none;position:absolute;top:-6px;right:-4px;font-size:12px;color:#1e295d;font-weight:bold}
.fb.on .ck{display:block}
.counter{position:absolute;bottom:18px;left:34px;font-size:12px;color:#1e295d;font-family:sans-serif;opacity:.7;z-index:5}
.top{display:flex;justify-content:center;align-items:center;height:115px;padding-left:26px;padding-right:10px}
.cat{width:95px;height:95px}
.qc{display:flex;justify-content:center;align-items:flex-start;text-align:center;padding:0 10px 100px 26px;height:calc(100% - 115px)}
.qt{font-family:'Bad Script',cursive!important;font-size:1.3rem;line-height:1.4;color:#1e295d;font-weight:400!important;word-wrap:break-word}
.footer{position:absolute;bottom:12px;left:0;width:100%;display:flex;flex-direction:column;align-items:center;padding:0 10px 0 26px}
.heart{width:24px;height:22px;margin-bottom:2px;transform:rotate(-10deg)}
.prod{font-size:.8rem;color:#1e295d;font-family:'Bad Script',cursive;opacity:.75}
.pw{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:20px;text-align:center;padding-left:26px}
.pt{font-family:'Bad Script',cursive;font-size:1.5rem;color:#1e295d;margin-bottom:20px;line-height:1.3}
.pd{font-family:sans-serif;font-size:.95rem;color:#666;margin-bottom:30px;line-height:1.5}
.pb{background:#1e295d;color:#fff;border:none;border-radius:30px;padding:14px 36px;font-size:1rem;font-family:sans-serif;font-weight:500;cursor:pointer;box-shadow:0 4px 12px rgba(30,41,93,.3)}
.controls{display:flex;gap:12px;align-items:center;justify-content:center;padding:0 10px}
.nav{background:rgba(0,0,0,.08);border:1px solid rgba(0,0,0,.25);color:#1a1a24;width:44px;height:44px;border-radius:50%;font-size:1.2rem;cursor:pointer;display:flex;justify-content:center;align-items:center}
.nav.hidden{display:none}
.hint{color:rgba(0,0,0,.55);font-size:.75rem;font-family:sans-serif;white-space:nowrap}
</style>
</head>
<body>
<div class="app">
<div class="slider" id="slider"></div>
<div class="controls">
<button class="nav hidden" id="prevBtn">❮</button>
<span class="hint">Свайпайте</span>
<button class="nav" id="nextBtn">❯</button>
</div>
</div>
<script>
var FREE=15,PAID=15;
var lang=localStorage.getItem('lang')||'ru';
var questions=[];
var idx=parseInt(localStorage.getItem('idx_'+lang)||'0');
var prem=localStorage.getItem('premium')==='true';
var cards=[],slider=document.getElementById('slider');
var catSVG='<svg class="cat" viewBox="0 0 100 110" fill="none" stroke="#d32f2f" stroke-width="2.6" stroke-linecap="round"><path d="M 37 57 L 15 20"/><ellipse cx="50" cy="65" rx="16" ry="17"/><path d="M 43 82 L 42 96"/><path d="M 48 82 L 50 96"/><path d="M 57 82 L 57 98"/><path d="M 62 80 L 65 96"/><ellipse cx="58" cy="38" rx="10" ry="9"/><path d="M 49 33 L 48 24 L 56 30"/><path d="M 60 30 L 68 26 L 66 35"/><circle cx="53" cy="36" r="1.2" fill="#d32f2f"/><circle cx="62" cy="36" r="1.2" fill="#d32f2f"/><circle cx="58" cy="39" r="2.5" fill="#d32f2f" stroke="none"/><path d="M 54 43 Q 56 46 58 43 Q 60 46 62 43" stroke-width="1.8"/><path d="M 50 36 L 40 33"/><path d="M 50 39 L 42 39"/><path d="M 50 42 L 47 45"/><path d="M 64 36 L 73 37"/><path d="M 64 39 L 75 42"/><path d="M 64 42 L 72 46"/></svg>';
var heartSVG='<svg class="heart" viewBox="0 0 100 90"><defs><pattern id="s" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(22)"><line x1="0" y1="0" x2="0" y2="6" stroke="#d32f2f" stroke-width="1.9" opacity="0.85"/><line x1="3" y1="0" x2="3" y2="6" stroke="#e04b4b" stroke-width="1.1" opacity="0.55"/></pattern></defs><path d="M 46 86 C 14 62, 2 44, 8 26 C 12 12, 26 4, 39 12 C 45 16, 47 24, 48 30 C 51 22, 57 14, 67 13 C 82 12, 94 22, 93 36 C 91 53, 74 66, 46 86 Z" fill="url(#s)"/><path d="M 46 86 C 14 62, 2 44, 8 26 C 12 12, 26 4, 39 12 C 45 16, 47 24, 48 30 C 51 22, 57 14, 67 13 C 82 12, 94 22, 93 36 C 91 53, 74 66, 46 86 Z" fill="none" stroke="#b71c1c" stroke-width="2.7" stroke-linecap="round"/></svg>';
var flagsHTML='<div class="flag"><button class="fb" data-l="ru">🇷🇺<span class="ck">✓</span></button><button class="fb" data-l="en">🇬🇧<span class="ck">✓</span></button><button class="fb" data-l="de">🇩🇪<span class="ck">✓</span></button></div>';
function setActive(){var bs=document.querySelectorAll('.fb');for(var i=0;i<bs.length;i++){if(bs[i].getAttribute('data-l')===lang)bs[i].classList.add('on');else bs[i].classList.remove('on');}}
function build(){
slider.innerHTML='';cards=[];
for(var i=0;i<questions.length;i++){
var locked=false;
var c=document.createElement('div');c.className='card';c.style.zIndex=questions.length-i;
var h;
if(locked){h=flagsHTML+'<div class="pw"><div class="pt">Здесь ещё '+PAID+' вопросов</div><div class="pd">Купите полную версию, чтобы открыть все вопросы.</div><button class="pb" onclick="pay()">Оплатить '+PAID+' вопросов</button></div>';}
else{h=flagsHTML+'<div class="top">'+catSVG+'</div><div class="qc"><div class="qt">'+questions[i]+'</div></div><div class="counter">'+(i+1)+' / '+questions.length+'</div><div class="footer">'+heartSVG+'<div class="prod">produced by Eugen Kisler</div></div>';}
c.innerHTML=h;slider.appendChild(c);cards.push(c);}
setActive();update();
}
function update(){
for(var i=0;i<cards.length;i++){var c=cards[i];
if(i<idx){c.style.transform='translateX(-120%) rotate(-8deg)';c.style.opacity='0';c.style.pointerEvents='none';}
else if(i===idx){c.style.transform='translateX(0) rotate(0) scale(1)';c.style.opacity='1';c.style.pointerEvents='auto';}
else{var o=i-idx;c.style.transform='translateY('+(o*6)+'px) scale('+(1-o*.03)+')';c.style.opacity=o>2?'0':'1';c.style.pointerEvents='none';}}
var pb=document.getElementById('prevBtn');
if(idx>0&&(prem||idx<FREE)){pb.classList.remove('hidden');}else{pb.classList.add('hidden');}
localStorage.setItem('idx_'+lang,idx);
}
function pay(){alert('Оплата '+PAID+' вопросов\n\nЗдесь будет Google Play Billing.\n\nПока тестовая версия.');}
function loadLang(l){
fetch(l+'.json').then(function(r){return r.json();}).then(function(data){
questions=data;lang=l;localStorage.setItem('lang',l);
idx=parseInt(localStorage.getItem('idx_'+l)||'0');
build();
});
}
var sx=0,cx=0,drag=false;
function hs(e){drag=true;sx=e.type.indexOf('touch')!==-1?e.touches[0].clientX:e.clientX;}
function hm(e){if(!drag)return;cx=e.type.indexOf('touch')!==-1?e.touches[0].clientX:e.clientX;var d=cx-sx;if(idx<cards.length){cards[idx].style.transform='translateX('+d+'px) rotate('+(d*.04)+'deg)';}}
function he(){if(!drag)return;drag=false;var d=cx-sx;if(Math.abs(d)>50){if(d<0&&idx<cards.length-1)idx++;else if(d>0&&idx>0)idx--;}update();}
document.addEventListener('click',function(e){var b=e.target.closest('.fb');if(b){var l=b.getAttribute('data-l');if(l!==lang)loadLang(l);}});
slider.addEventListener('touchstart',hs);slider.addEventListener('touchmove',hm);slider.addEventListener('touchend',he);
slider.addEventListener('mousedown',hs);window.addEventListener('mousemove',hm);window.addEventListener('mouseup',he);
document.getElementById('nextBtn').addEventListener('click',function(){if(idx<cards.length-1){idx++;update();}});
document.getElementById('prevBtn').addEventListener('click',function(){if(idx>0){idx--;update();}});
window.addEventListener('keydown',function(e){if(e.key==='ArrowRight'&&idx<cards.length-1){idx++;update();}else if(e.key==='ArrowLeft'&&idx>0){idx--;update();}});
loadLang(lang);
</script>
</body>
</html>
